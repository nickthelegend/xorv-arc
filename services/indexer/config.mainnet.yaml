# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
#
# Xorv indexer, Arc MAINNET (chain 5042). Same schema, ABIs and handlers as
# config.yaml; only the chain id, HyperSync/RPC and ERC-8004 singleton addresses differ.
#
#   pnpm codegen:mainnet && pnpm dev:mainnet        (local, WSL/Linux/macOS)
#   Envio Cloud: add a second indexer with "Config file" = config.mainnet.yaml
#
# Keep the contract list and event list identical to config.yaml: the handlers are
# shared, and codegen types every handler against whichever config it was run with.
name: xorv-indexer
description: Xorv on Arc - x402 job receipts, escrow, CCIP jobs and ERC-8004 identity/reputation

address_format: lowercase

contracts:
  - name: XorvLedger
    abi_file_path: ./abis/XorvLedger.json
    events:
      - event: ProviderRegistered
      - event: ProviderHeartbeat
      - event: JobRecorded
      - event: JobRated
      - event: BrokerSet
      - event: OwnershipTransferred
  - name: XorvEscrow
    abi_file_path: ./abis/XorvEscrow.json
    events:
      - event: JobFunded
      - event: JobReleased
      - event: JobRefunded
      - event: JobReassigned
  - name: XorvReputation
    abi_file_path: ./abis/XorvReputation.json
    events:
      - event: AgentBound
      - event: OutcomeRecorded
  - name: XorvCcipReceiver
    abi_file_path: ./abis/XorvCcipReceiver.json
    events:
      - event: IntentReceived
      - event: IntentFunded
      - event: IntentPending
      - event: IntentReleased
      - event: IntentCancelled
      - event: RefundClaimed
  - name: IdentityRegistry
    abi_file_path: ./abis/IdentityRegistry.json
    events:
      - event: Registered
      - event: URIUpdated
      # Only the reserved "agentWallet" key matters to us (the handler ignores the rest):
      # it is the payee XorvLedger.recordJobs enforces, and a transfer clears it.
      - event: MetadataSet
      - event: Transfer
  - name: ReputationRegistry
    abi_file_path: ./abis/ReputationRegistry.json
    events:
      - event: NewFeedback
      - event: FeedbackRevoked
      - event: ResponseAppended

chains:
  - id: 5042 # Arc mainnet
    start_block: 0
    # Envio HyperSync serves Arc (checked 2026-10-07: https://arc.hypersync.xyz/height answers).
    hypersync_config:
      url: https://arc.hypersync.xyz
    rpc:
      # Fallback only; HyperSync is the primary source. Arc's public RPC caps eth_getLogs
      # at 10,000 blocks.
      - url: ${ENVIO_ARC_RPC_URL:-https://rpc.mainnet.arc.io}
        for: fallback
    contracts:
      - name: XorvLedger
        # From deployments/arc-mainnet.json (scripts/deploy.sh). Keep the start block at or
        # before the deploy block: the constructor's BrokerSet is how the indexer learns
        # which address is the trusted verifier (ENVIO_XORV_VERIFIER_ADDRESSES covers a later start).
        address: "0xc9980A3A07A6CBBfc528cf10ccf3285EF0978c3f"
        start_block: 25937948
      - name: XorvEscrow
        # Zero indexes nothing.
        address: "0x6EF98A57FC25e237d25CB59B5F24a964E07e6412"
        start_block: 25937948
      - name: XorvReputation
        address: "0x1C2c20852A68b92ed7d95DD372575eD99728158F"
        start_block: 25937948
      - name: XorvCcipReceiver
        address: "0xE4de2F7828d580954f8Ea36713Cf40766b37eDe1"
        start_block: 25937948
      - name: IdentityRegistry
        address: "0x8004A169FB4a3325136EB29fA0ceB6D2e539a432"
        start_block: 25937948
      - name: ReputationRegistry
        address: "0x8004BAa17C55a88189AE136b182e5fdA19dE9b63"
        start_block: 25937948
