# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
#
# Xorv indexer, Arc TESTNET (chain 5042002). This is the default config: `envio dev`,
# `envio codegen` and Envio Cloud all read config.yaml unless told otherwise.
# config.mainnet.yaml is the same indexer pointed at Arc mainnet (chain 5042).
#
# Six contracts feed one schema:
#   XorvLedger          provider registry, heartbeats, x402 job receipts and buyer ratings
#   XorvEscrow          escrowed payments: funded, released, refunded, reassigned
#   XorvReputation      escrow settlement outcomes written to ERC-8004 (tag "successRate")
#                       and the payout-wallet -> agent bindings
#   XorvCcipReceiver    jobs posted from Base/Ethereum over Chainlink CCIP (CCTP moves the USDC)
#   IdentityRegistry    ERC-8004 v2.0.0 singleton: every agent on Arc, its owner, agentURI
#                       and agentWallet (the address XorvLedger checks payTo against)
#   ReputationRegistry  ERC-8004 v2.0.0 singleton: every feedback entry, including buyer
#                       ratings (XorvLedger), verifier scores and escrow outcomes (XorvReputation)
#
# The env placeholders below are interpolated at codegen/start time (even inside
# comments, so never write the dollar-brace syntax in a comment here). Envio Cloud only
# forwards variables prefixed with ENVIO_, which is why none of them reuse the broker's
# XORV_* names.
name: xorv-indexer
description: Xorv on Arc - x402 job receipts, escrow, CCIP jobs and ERC-8004 identity/reputation

# The app and broker look entities up by address. Checksummed ids would force every
# caller to checksum before an `_eq` filter; lowercase makes "lowercase it" the one rule.
address_format: lowercase

contracts:
  - name: XorvLedger
    abi_file_path: ./abis/XorvLedger.json
    events:
      - event: ProviderRegistered
      - event: ProviderHeartbeat
      - event: JobRecorded
      - event: JobRated
      - event: BrokerSet
      - event: OwnershipTransferred
  - name: XorvEscrow
    abi_file_path: ./abis/XorvEscrow.json
    events:
      - event: JobFunded
      - event: JobReleased
      - event: JobRefunded
      - event: JobReassigned
  - name: XorvReputation
    abi_file_path: ./abis/XorvReputation.json
    events:
      - event: AgentBound
      - event: OutcomeRecorded
  - name: XorvCcipReceiver
    abi_file_path: ./abis/XorvCcipReceiver.json
    events:
      - event: IntentReceived
      - event: IntentFunded
      - event: IntentPending
      - event: IntentReleased
      - event: IntentCancelled
      - event: RefundClaimed
  - name: IdentityRegistry
    abi_file_path: ./abis/IdentityRegistry.json
    events:
      - event: Registered
      - event: URIUpdated
      # Only the reserved "agentWallet" key matters to us (the handler ignores the rest):
      # it is the payee XorvLedger.recordJobs enforces, and a transfer clears it.
      - event: MetadataSet
      - event: Transfer
  - name: ReputationRegistry
    abi_file_path: ./abis/ReputationRegistry.json
    events:
      - event: NewFeedback
      - event: FeedbackRevoked
      - event: ResponseAppended

chains:
  - id: 5042002 # Arc testnet
    start_block: 0
    # Envio HyperSync serves Arc (checked 2026-10-07: https://arc-testnet.hypersync.xyz/height answers).
    hypersync_config:
      url: https://arc-testnet.hypersync.xyz
    rpc:
      # Fallback only; HyperSync is the primary source. Arc's public RPC caps eth_getLogs
      # at 10,000 blocks.
      - url: ${ENVIO_ARC_RPC_URL:-https://rpc.testnet.arc.io}
        for: fallback
    contracts:
      - name: XorvLedger
        # From deployments/arc-testnet.json (scripts/deploy.sh). Keep the start block at or
        # before the deploy block: the constructor's BrokerSet is how the indexer learns
        # which address is the trusted verifier (ENVIO_XORV_VERIFIER_ADDRESSES covers a later start).
        address: "${ENVIO_XORV_LEDGER_ADDRESS:-0x0000000000000000000000000000000000000000}"
        start_block: ${ENVIO_XORV_LEDGER_START_BLOCK:-null}
      - name: XorvEscrow
        # Zero indexes nothing.
        address: "${ENVIO_XORV_ESCROW_ADDRESS:-0x0000000000000000000000000000000000000000}"
        start_block: ${ENVIO_XORV_ESCROW_START_BLOCK:-null}
      - name: XorvReputation
        address: "${ENVIO_XORV_REPUTATION_ADDRESS:-0x0000000000000000000000000000000000000000}"
        start_block: ${ENVIO_XORV_ESCROW_START_BLOCK:-null}
      - name: XorvCcipReceiver
        address: "${ENVIO_XORV_CCIP_RECEIVER_ADDRESS:-0x0000000000000000000000000000000000000000}"
        start_block: ${ENVIO_XORV_ESCROW_START_BLOCK:-null}
      - name: IdentityRegistry
        address: "0x8004A818BFB912233c491871b3d84c89A494BD9e"
        start_block: ${ENVIO_ERC8004_START_BLOCK:-null}
      - name: ReputationRegistry
        address: "0x8004B663056A597Dffe9eCcC1965A193B7388713"
        start_block: ${ENVIO_ERC8004_START_BLOCK:-null}
